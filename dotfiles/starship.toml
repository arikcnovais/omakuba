# ~/.config/starship.toml do omakuba
# Prompt curto: pasta, branch, status, Node ou .NET.

format = """
$directory\
$git_branch\
$git_status\
$nodejs\
$dotnet\
$line_break\
$character"""

add_newline = false
command_timeout = 1000

# Git
[git_branch]
format = " on [$symbol$branch]($style) "
symbol = " "
style = "bold #f67400"

[git_status]
format = "$conflicts$untracked$modified$staged"
style = "bold"
conflicted = "✖"
untracked = "? "
modified = "!"
staged = "+"

# Linguagens
[nodejs]
symbol = " node "
style = "bold #44853a"
format = "[$symbol($version )]($style)"

[dotnet]
symbol = " dotnet "
style = "bold #9b59b6"
format = "[$symbol($version )]($style)"

[docker_context]
symbol = "  docker "
style = "bold #1d99f3"
format = "[$symbol]($style)"

# Partes
[directory]
style = "bold #fcfcfc"
format = "[$path]($style) "
truncate_to_repo = true

[character]
success_symbol = "[❯](bold #1abc9c)"
error_symbol   = "[❯](bold #ed1515)"
vicmd_symbol   = "[❮](bold #fdbc4b)"

# ~/.config/kitty/kitty.conf — omakuba
# Terminal padrão do setup (Super+Return). Rápido, escuro e discreto.

# ── Fonte ────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        12.0

# ── Aparência ────────────────────────────────────────────────────────────────
shell                   zsh
window_padding_width    8 10
background_opacity      1.0
confirm_os_window_close 0
focus_follows_mouse     no
mouse_hide_wait         2.0
hide_window_decorations no
remember_window_size    yes

# Cursor
cursor                 #fabd2f
cursor_text_color      #1d2021
cursor_shape           beam
cursor_blink_interval  0.6

# Cores (paleta Gruvbox dark, combina com o prompt)
foreground #ebdbb2
background #1d2021
selection_foreground #1d2021
selection_background #83a598
url_color            #83a598
bell_border_color    #fabd2f

# Abas discretas
active_tab_foreground   #fabd2f
active_tab_background   #282828
inactive_tab_foreground #928374
inactive_tab_background #282828
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2

# ── Comportamento ────────────────────────────────────────────────────────────
scrollback_pager       less
scrollback_lines       10000
wheel_scroll_multiplier 3.0
copy_on_select         no
allow_remote_control   no

# ── Atalhos ──────────────────────────────────────────────────────────────────
map ctrl+shift+t new_tab
map ctrl+shift+n new_window
map ctrl+shift+w close_window
map ctrl+shift+d close_tab
map ctrl+shift+k scroll_page_up
map ctrl+shift+j scroll_page_down
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
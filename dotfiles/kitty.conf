# ~/.config/kitty/kitty.conf — omakuba
# Terminal padrão do setup (Super+Return). Rápido, escuro e discreto.

# ── Fonte ────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
font_size        12.0

# ── Aparência ────────────────────────────────────────────────────────────────
shell                   zsh
window_padding_width    8 10
background_opacity      1.0
confirm_os_window_close 0
focus_follows_mouse     no
mouse_hide_wait         2.0
hide_window_decorations no
remember_window_size    yes

# Cursor
cursor                 #00bc96
cursor_text_color      #1e2229
cursor_shape           beam
cursor_blink_interval  0.6

# Cores — paleta "Breath" (Manjaro Breath, o colorscheme oficial do Konsole)
foreground #17a88b
background #1e2229
selection_foreground #1e2229
selection_background #17a88b
url_color            #1d99f3
bell_border_color    #f67400

# Normal
color0  #1e2229
color1  #ed1515
color2  #44853a
color3  #f67400
color4  #1d99f3
color5  #9b59b6
color6  #1abc9c
color7  #fcfcfc

# Bright
color8  #7f8c8d
color9  #c0392b
color10 #55a649
color11 #fdbc4b
color12 #3daee9
color13 #8e44ad
color14 #16a085
color15 #ffffff

# Abas discretas
active_tab_foreground   #00bc96
active_tab_background   #2e3439
inactive_tab_foreground #7f8c8d
inactive_tab_background #1e2229
tab_bar_style           powerline
tab_powerline_style     slanted
tab_bar_min_tabs        2

# ── Comportamento ────────────────────────────────────────────────────────────
scrollback_pager       less
scrollback_lines       10000
wheel_scroll_multiplier 3.0
copy_on_select         no
allow_remote_control   no

# ── Atalhos ──────────────────────────────────────────────────────────────────
map ctrl+shift+t new_tab
map ctrl+shift+n new_window
map ctrl+shift+w close_window
map ctrl+shift+d close_tab
map ctrl+shift+k scroll_page_up
map ctrl+shift+j scroll_page_down
map ctrl+shift+1 goto_tab 1
map ctrl+shift+2 goto_tab 2
map ctrl+shift+3 goto_tab 3
map ctrl+shift+4 goto_tab 4
map ctrl+shift+5 goto_tab 5
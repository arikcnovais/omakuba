# ~/.tmux.conf do omakuba
# Sessões que sobrevivem a queda de conexão. Bom para builds longos.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on

setw -g mode-keys vi
setw -g mouse on

# Índices a partir de 1.
set -g base-index 1
setw -g pane-base-index 1
set -g pane-border-status top
set -g pane-border-format " #{pane_index} "

# Divisões com | (lado a lado) e - (empilhado).
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-layout even-horizontal
bind v select-layout even-vertical

# Recarrega a config.
bind r source-file ~/.tmux.conf \; display "omakuba: tmux recarregado"

# Barra discreta com a paleta Breath.
set -g status-style "bg=#1e2229,fg=#7f8c8d"
set -g status-left " #[fg=#f67400]#S#default "
set -g status-right " #[fg=#1d99f3]%H:%M#[default] "
set -g status-left-length 30
set -g status-interval 5

setw -g window-status-current-style "bg=#17a88b,fg=#1e2229,bold"

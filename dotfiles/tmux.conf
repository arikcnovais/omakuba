# ~/.tmux.conf — omakuba
# Multiplexador de terminal: sobrevive a queda de conexão, útil p/ builds longos.

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB"

set -g mouse on
set -g history-limit 50000
set -g escape-time 10
set -g focus-events on
set -g renumber-windows on

setw -g mode-keys vi
setw -g mouse on

# Índices a partir de 1 (estilo i3).
set -g base-index 1
setw -g pane-base-index 1
set -g pane-border-status top
set -g pane-border-format " #{pane_index} "

# Divisões com |- (lado a lado) e - (empilhado).
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-layout even-horizontal
bind v select-layout even-vertical

# Recarrega a config.
bind r source-file ~/.tmux.conf \; display "omakuba: tmux recarregado"

# Barra de status discreta (cores Gruvbox).
set -g status-style "bg=#282828,fg=#928374"
set -g status-left " #[fg=#fabd2f]#S#default "
set -g status-right " #[fg=#83a598]%H:%M#[default] "
set -g status-left-length 30
set -g status-interval 5

setw -g window-status-current-style "bg=#fabd2f,fg=#282828,bold"